<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Brief Generator — CD Commerce</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --color-primary:#0F172A;
    --color-primary-light:#1E293B;
    --color-accent:#D97757;
    --color-accent-light:#E8956F;
    --color-accent-dark:#C4623F;
    --color-accent-subtle:#FDF2EE;
    --color-white:#FFFFFF;
    --color-success:#10B981;
    --color-warning:#F59E0B;
    --color-error:#EF4444;
    --n-50:#F8FAFC; --n-100:#F1F5F9; --n-200:#E2E8F0; --n-300:#CBD5E1;
    --n-400:#94A3B8; --n-500:#64748B; --n-700:#334155; --n-900:#0F172A;
    --font-heading:'Poppins',sans-serif;
    --font-body:'Inter',sans-serif;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:24px;
    --shadow-sm:0 1px 3px rgba(15,23,42,0.06);
    --shadow-md:0 4px 12px rgba(15,23,42,0.08);
    --shadow-lg:0 12px 32px rgba(15,23,42,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--n-50);color:var(--n-900);font-family:var(--font-body);}
  h1,h2,h3,h4{font-family:var(--font-heading);margin:0;}
  button{font-family:var(--font-heading);cursor:pointer;}
  input,textarea,select{font-family:var(--font-body);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--n-300);border-radius:10px;}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px;flex-shrink:0;background:var(--color-primary);
    color:var(--n-100);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);}
  .sidebar-brand img{width:30px;height:30px;filter:invert(1);}
  .sidebar-brand .name{font-family:var(--font-heading);font-weight:700;font-size:15px;color:#fff;}
  .sidebar-brand .sub{font-size:11px;color:var(--n-400);letter-spacing:0.02em;}
  .sidebar-newbtn{margin:16px 16px 8px;padding:11px 14px;background:var(--color-accent);color:#fff;
    border:none;border-radius:var(--radius-md);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px;justify-content:center;
    box-shadow:var(--shadow-sm);transition:background .15s;}
  .sidebar-newbtn:hover{background:var(--color-accent-dark);}
  .sidebar-search{margin:4px 16px 10px;}
  .sidebar-search input{width:100%;padding:8px 10px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.12);
    background:rgba(255,255,255,0.06);color:#fff;font-size:12.5px;}
  .sidebar-search input::placeholder{color:var(--n-400);}
  .sidebar-list{flex:1;padding:4px 10px 16px;}
  .sidebar-empty{color:var(--n-400);font-size:12.5px;padding:16px 10px;line-height:1.6;}
  .brief-card{padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:4px;cursor:pointer;transition:background .12s;}
  .brief-card:hover{background:rgba(255,255,255,0.06);}
  .brief-card.active{background:rgba(217,119,87,0.18);}
  .brief-card .bc-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  .brief-card .bc-article{font-size:12px;font-weight:700;color:var(--color-accent-light);letter-spacing:0.02em;}
  .brief-card .bc-ver{font-size:10.5px;color:var(--n-400);font-weight:600;}
  .brief-card .bc-item{font-size:13px;color:#fff;margin-top:2px;font-weight:500;line-height:1.3;}
  .brief-card .bc-meta{font-size:10.5px;color:var(--n-400);margin-top:4px;}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;}
  .status-draft{background:var(--n-400);}
  .status-live{background:var(--color-success);}
  .status-signed{background:var(--color-accent);}

  .sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);font-size:10.5px;color:var(--n-400);}
  .sidebar-footer a{color:var(--n-400);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:#fff;border-bottom:1px solid var(--n-200);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;gap:16px;flex-wrap:wrap;}
  .topbar .filename{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;color:var(--n-500);background:var(--n-100);
    padding:6px 10px;border-radius:var(--radius-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px;}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .btn{border:none;border-radius:var(--radius-md);padding:9px 16px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .12s;white-space:nowrap;}
  .btn-primary{background:var(--color-accent);color:#fff;}
  .btn-primary:hover{background:var(--color-accent-dark);}
  .btn-secondary{background:var(--color-primary);color:#fff;}
  .btn-secondary:hover{background:var(--color-primary-light);}
  .btn-outline{background:#fff;color:var(--color-primary);border:1px solid var(--n-300);}
  .btn-outline:hover{background:var(--n-100);}
  .btn-ghost{background:transparent;color:var(--color-accent);}
  .btn-ghost:hover{background:var(--color-accent-subtle);}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--radius-sm);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .content{flex:1;padding:28px;max-width:980px;width:100%;margin:0 auto;}

  /* Dashboard */
  .dash-hero{background:linear-gradient(135deg,#0F172A,#1E293B);border-radius:var(--radius-lg);padding:32px;color:#fff;margin-bottom:24px;
    display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
  .dash-hero h1{font-size:24px;font-weight:700;}
  .dash-hero p{font-size:13.5px;color:var(--n-300);margin-top:6px;max-width:480px;line-height:1.6;}
  .stat-row{display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-card{background:#fff;border:1px solid var(--n-200);border-radius:var(--radius-md);padding:16px 20px;flex:1;min-width:140px;box-shadow:var(--shadow-sm);}
  .stat-card .num{font-family:var(--font-heading);font-size:26px;font-weight:700;color:var(--color-primary);}
  .stat-card .lbl{font-size:12px;color:var(--n-500);margin-top:2px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .card{background:#fff;border:1px solid var(--n-200);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .15s,transform .15s;}
  .card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .card .c-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .card .c-article{font-size:11.5px;font-weight:700;color:var(--color-accent);letter-spacing:0.03em;}
  .card .c-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.03em;}
  .badge-draft{background:var(--n-100);color:var(--n-500);}
  .badge-live{background:#ECFDF5;color:#047857;}
  .badge-signed{background:var(--color-accent-subtle);color:var(--color-accent-dark);}
  .card h3{font-size:15.5px;margin-top:6px;color:var(--color-primary);}
  .card .c-meta{font-size:12px;color:var(--n-500);margin-top:10px;display:flex;justify-content:space-between;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--n-500);}
  .empty-state h3{color:var(--color-primary);margin-bottom:6px;}
  .empty-state p{font-size:13.5px;line-height:1.6;max-width:420px;margin:0 auto 18px;}

  /* Editor */
  .section-card{background:#fff;border:1px solid var(--n-200);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .section-card h2{font-size:15px;color:var(--color-primary);display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .section-card h2 .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:var(--color-accent-subtle);
    color:var(--color-accent-dark);border-radius:6px;font-size:11.5px;font-weight:700;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11.5px;font-weight:600;color:var(--n-500);text-transform:uppercase;letter-spacing:.02em;}
  .field input,.field textarea,.field select{padding:9px 11px;border:1px solid var(--n-300);border-radius:var(--radius-sm);font-size:13.5px;color:var(--n-900);background:#fff;}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--color-accent);box-shadow:0 0 0 3px rgba(217,119,87,0.12);}
  .field textarea{resize:vertical;min-height:60px;line-height:1.5;}
  .hint{font-size:11px;color:var(--n-400);margin-top:2px;}

  .list-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .list-row input,.list-row textarea{flex:1;padding:8px 10px;border:1px solid var(--n-300);border-radius:var(--radius-sm);font-size:13px;}
  .list-row textarea{resize:vertical;min-height:40px;}
  .icon-btn{width:30px;height:30px;flex-shrink:0;border:1px solid var(--n-200);background:#fff;border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;color:var(--n-500);font-size:15px;line-height:1;}
  .icon-btn:hover{background:#FEF2F2;color:var(--color-error);border-color:#FECACA;}
  .add-row-btn{margin-top:2px;background:transparent;border:1.5px dashed var(--n-300);color:var(--n-500);border-radius:var(--radius-sm);
    padding:8px 12px;font-size:12.5px;font-weight:600;width:100%;text-align:center;}
  .add-row-btn:hover{border-color:var(--color-accent);color:var(--color-accent);background:var(--color-accent-subtle);}

  table.editor-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  table.editor-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--n-500);text-align:left;padding:0 8px 6px;}
  table.editor-table td{padding:4px;vertical-align:top;}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:var(--radius-lg);max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--n-200);display:flex;justify-content:space-between;align-items:center;}
  .modal-header h3{font-size:16px;color:var(--color-primary);}
  .modal-close{background:none;border:none;font-size:20px;color:var(--n-400);width:30px;height:30px;border-radius:8px;}
  .modal-close:hover{background:var(--n-100);}
  .modal-body{padding:20px 24px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--n-200);display:flex;justify-content:flex-end;gap:8px;}

  .dropzone{border:2px dashed var(--n-300);border-radius:var(--radius-md);padding:32px;text-align:center;color:var(--n-500);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s;}
  .dropzone:hover{border-color:var(--color-accent);background:var(--color-accent-subtle);}
  .dropzone input{display:none;}

  .match-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--n-100);}
  .match-row label{font-size:12px;font-weight:600;color:var(--n-500);}
  .match-row select,.match-row input{padding:6px 8px;font-size:12.5px;border:1px solid var(--n-300);border-radius:var(--radius-sm);width:100%;}

  .history-item{border-left:3px solid var(--n-200);padding:10px 0 10px 14px;margin-bottom:2px;position:relative;}
  .history-item.current{border-left-color:var(--color-accent);}
  .history-item .h-top{display:flex;justify-content:space-between;align-items:center;}
  .history-item .h-ver{font-weight:700;font-size:13.5px;color:var(--color-primary);}
  .history-item .h-date{font-size:11.5px;color:var(--n-400);}
  .history-item .h-note{font-size:12.5px;color:var(--n-500);margin-top:3px;}
  .history-item .h-actions{margin-top:6px;display:flex;gap:6px;}

  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:100px;}
  .tag-info{background:#EFF6FF;color:#1D4ED8;}
  .tag-warn{background:#FFFBEB;color:#B45309;}

  .drive-box{background:var(--color-accent-subtle);border-radius:var(--radius-md);padding:14px 16px;font-size:12.5px;color:var(--n-700);line-height:1.6;margin-top:10px;}
  .drive-box code{background:rgba(255,255,255,0.7);padding:1px 6px;border-radius:4px;font-size:11.5px;}

  .toast{position:fixed;bottom:22px;right:22px;background:var(--color-primary);color:#fff;padding:12px 18px;border-radius:var(--radius-md);
    font-size:13px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

  @media(max-width:860px){
    .sidebar{position:fixed;left:-280px;transition:left .2s;z-index:50;}
    .sidebar.open{left:0;}
    .field-row{grid-template-columns:1fr;}
    .content{padding:16px;}
  }
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast"></div>

/* ---------------- API client (Google Apps Script backend) ---------------- */
function isConfigured(){
  return APPS_SCRIPT_URL.startsWith("http");
}

// GET is used for read-only actions (no CORS preflight issues). POST is used
// for writes, sent as text/plain to dodge the CORS preflight that Apps
// Script Web Apps can't answer (no doOptions handler) — the server parses
// the body as JSON regardless of the declared content type.
async function callApi(action, payload){
  payload = payload || {};
  if(!isConfigured()) return { ok:false, error:"NOT_CONFIGURED" };
  try{
    let response;
    if(action === "whoami" || action === "listBriefs" || action === "getHistory"){
      const params = new URLSearchParams(Object.assign({ action }, payload));
      response = await fetch(APPS_SCRIPT_URL + "?" + params.toString(), { method: "GET" });
    } else {
      response = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ action }, payload)),
      });
    }
    const text = await response.text();
    try{
      return JSON.parse(text);
    }catch(parseErr){
      // Response wasn't JSON — almost always means Google served a login/consent
      // page instead of running the script, i.e. the caller isn't signed in.
      return { ok:false, error:"NOT_SIGNED_IN" };
    }
  }catch(e){
    console.error("callApi failed", action, e);
    return { ok:false, error: e.message };
  }
}

/* ---------------- Auth ---------------- */
// There's no OAuth popup here — identity comes from the caller's existing
// Google session cookie, checked server-side by the Apps Script deployment's
// domain-restricted access setting, and again inside the script itself.
async function checkSession(){
  if(!isConfigured()){
    state.authStatus = "needs_google_login"; // reused as the generic "can't proceed" screen when unconfigured; renderAuthScreen checks isConfigured() first anyway
    return;
  }
  const res = await callApi("whoami");
  if(!res.ok){
    if(res.error === "ACCESS_DENIED"){
      state.user = null;
      state.authStatus = "denied";
    } else {
      // NOT_SIGNED_IN or any other failure — treat as "needs to sign into Google"
      state.user = null;
      state.authStatus = "needs_google_login";
    }
    return;
  }
  const email = res.data && res.data.email;
  if(!email || !email.toLowerCase().endsWith("@" + ALLOWED_EMAIL_DOMAIN.toLowerCase())){
    state.user = null;
    state.authStatus = "denied";
    return;
  }
  state.user = { email };
  state.authStatus = "signed_in";
}

function openGoogleSignIn(){
  // Visiting the exec URL directly (full navigation, not fetch) triggers
  // Google's normal login prompt if the person isn't already signed in.
  // Once that succeeds, the session cookie covers subsequent fetch() calls
  // from this app too.
  window.open(APPS_SCRIPT_URL, "_blank");
}

async function retryAuth(){
  state.authStatus = "checking";
  render();
  await checkSession();
  if(state.authStatus === "signed_in"){
    state.briefs = await loadAllBriefs();
    state.loading = false;
  }
  render();
}

/* ---------------- Data mapping: JS brief object <-> Apps Script row ---------------- */
function briefToApiPayload(b){
  const { inclusions, workmanship, techSpecs, packaging, qcLimits, compliance, changeContacts } = b;
  return {
    id: b.id,
    article_no: b.articleNo,
    item: b.item,
    po_number: b.poNumber,
    supplier_name: b.supplierName,
    supplier_address: b.supplierAddress,
    supplier_contact: b.supplierContact,
    supplier_email: b.supplierEmail,
    supplier_incoterm: b.supplierIncoterm,
    description: b.description,
    material: b.material,
    color: b.color,
    status: b.status,
    version: b.version,
    data: { inclusions, workmanship, techSpecs, packaging, qcLimits, compliance, changeContacts },
  };
}
function rowToBrief(row){
  let d = {};
  try{ d = row.data_json ? JSON.parse(row.data_json) : {}; }catch(e){ d = {}; }
  return {
    id: row.id,
    articleNo: row.article_no || "",
    item: row.item || "",
    poNumber: row.po_number || "",
    supplierName: row.supplier_name || "",
    supplierAddress: row.supplier_address || "",
    supplierContact: row.supplier_contact || "",
    supplierEmail: row.supplier_email || "",
    supplierIncoterm: row.supplier_incoterm || "",
    description: row.description || "",
    material: row.material || "",
    color: row.color || "",
    inclusions: d.inclusions && d.inclusions.length ? d.inclusions : [""],
    workmanship: d.workmanship && d.workmanship.length ? d.workmanship : [{component:"",spec:""}],
    techSpecs: d.techSpecs && d.techSpecs.length ? d.techSpecs : [{label:"",value:""}],
    packaging: d.packaging || {material:"",dimensions:"",weight:"",notes:[""]},
    qcLimits: d.qcLimits && d.qcLimits.length ? d.qcLimits : [{parameter:"",acceptable:"",notAcceptable:""}],
    compliance: d.compliance && d.compliance.length ? d.compliance : [{standard:"",testReportNo:""}],
    changeContacts: d.changeContacts && d.changeContacts.length ? d.changeContacts : [{name:"",email:""}],
    version: row.version,
    status: row.status,
    createdAt: row.created_at,
    updatedAt: row.updated_at,
    createdBy: row.created_by,
    updatedBy: row.updated_by,
    history: [], // loaded separately via fetchHistory()
  };
}

/* ---------------- Storage (Apps Script + Sheets) ---------------- */
async function loadAllBriefs(){
  const res = await callApi("listBriefs");
  if(!res.ok){ showToast("Couldn't load briefs — " + res.error); return []; }
  return (res.data || []).map(rowToBrief);
}

async function fetchHistory(briefId){
  const res = await callApi("getHistory", { briefId });
  if(!res.ok){ console.error("fetchHistory failed", res.error); return []; }
  return (res.data || []).map(r => ({
    version: r.version, date: r.created_at, note: r.note,
    createdBy: r.created_by, snapshot: r.snapshot_json ? JSON.parse(r.snapshot_json) : {}
  }));
}

async function persistBrief(brief){
  if(!isConfigured()){
    showToast("The Apps Script URL isn't configured yet — add it at the top of the script.");
    return false;
  }
  const res = await callApi("saveBrief", { brief: briefToApiPayload(brief) });
  if(!res.ok){ showToast("Save failed — " + res.error); return false; }
  brief._existsInDb = true;
  return true;
}

async function insertVersionRow(briefId, version, note, snapshot){
  const res = await callApi("addVersion", { briefId, version, note, snapshot });
  if(!res.ok){ showToast("Saved the brief, but couldn't log version history — " + res.error); return false; }
  return true;
}

/* ---------------- Utilities ---------------- */
function slugify(s){
  return (s||"").toString().trim().replace(/[^a-zA-Z0-9\-_. ]/g,"").replace(/\s+/g,"_");
}
function safeFilePart(s){
  return (s||"").toString().trim().replace(/[\/\\:\*\?"<>\|]/g,"-");
}
function fmtDate(d){
  const dt = new Date(d);
  const yyyy = dt.getFullYear();
  const mm = String(dt.getMonth()+1).padStart(2,"0");
  const dd = String(dt.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}
function fmtDateTime(d){
  const dt = new Date(d);
  return dt.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) + " · " +
         dt.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
}
function bumpMinor(v){ const [maj,min] = v.split(".").map(Number); return `${maj}.${min+1}`; }
function bumpMajor(v){ const [maj] = v.split(".").map(Number); return `${maj+1}.0`; }

function liveFileName(b){
  return `Product Brief_${safeFilePart(b.articleNo)}_${safeFilePart(b.item)}_v${b.version}`;
}
function versionFileName(b, version, dateStr){
  return `Product Brief_${safeFilePart(b.articleNo)}_${safeFilePart(b.item)}_v${version}_${dateStr}`;
}
function signedFileName(b){
  return `Product Brief_${safeFilePart(b.articleNo)}_${safeFilePart(b.item)}_${safeFilePart(b.poNumber)}_${safeFilePart(b.supplierIncoterm)}`;
}
function suggestedDriveFolder(b){
  const article = b.articleNo || "[Article No]";
  const item = b.item || "[Item]";
  return `01 Product Brief by SKU / ${article} - ${item} /`;
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 3200);
}

function esc(s){
  return (s||"").toString()
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}
function nl2br(s){
  return esc(s).replace(/\n/g,"<br/>");
}

/* ---------------- Render root ---------------- */
async function init(){
  render(); // show "checking" screen immediately
  await checkSession();
  if(state.authStatus === "signed_in"){
    state.briefs = await loadAllBriefs();
  }
  state.loading = false;
  render();
}

function render(){
  const app = document.getElementById("app");

  if(state.authStatus !== "signed_in"){
    app.innerHTML = renderAuthScreen();
    return;
  }

  app.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${state.view === "dashboard" ? renderDashboardTopbar() : renderEditorTopbar()}
      <div class="content">
        ${state.view === "dashboard" ? renderDashboard() : renderEditor()}
      </div>
    </div>
    ${state.importStep > 0 ? renderImportModal() : ""}
    ${state.historyOpenFor ? renderHistoryModal() : ""}
  `;
}

  const shell = (inner) => `

        <img src="data:image/png;base64,${LOGO_B64}" style="width:44px;height:44px;margin-bottom:16px;"/>
        ${inner}
      </div>
    </div>`;

  if(!isConfigured()){
    return shell(`
      <h2 style="font-size:17px;color:var(--color-primary);margin-bottom:8px;">Apps Script isn't configured yet</h2>
      <p style="font-size:13px;color:var(--n-500);line-height:1.6;">Deploy <code>Code.gs</code> as a Web App and paste its URL into <code>APPS_SCRIPT_URL</code> at the top of the script. See SETUP.md.</p>
    `);
  }
  if(state.authStatus === "checking"){
    return shell(`<p style="font-size:13.5px;color:var(--n-500);">Checking access…</p>`);
  }
  if(state.authStatus === "denied"){
    return shell(`
      <h2 style="font-size:17px;color:var(--color-primary);margin-bottom:8px;">Access restricted</h2>
      <p style="font-size:13px;color:var(--n-500);line-height:1.6;margin-bottom:20px;">This app is limited to CD Commerce accounts (@${esc(ALLOWED_EMAIL_DOMAIN)}). If you need to switch Google accounts in this browser, do that first, then retry.</p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="retryAuth()">Retry</button>
    `);
  }
  // needs_google_login
  return shell(`
    <h2 style="font-size:17px;color:var(--color-primary);margin-bottom:6px;">Product Brief Generator</h2>
    <p style="font-size:13px;color:var(--n-500);line-height:1.6;margin-bottom:20px;">This app checks your existing Google sign-in rather than its own login form. If you're not signed into a @${esc(ALLOWED_EMAIL_DOMAIN)} Google account in this browser, sign in first.</p>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:10px;" onclick="openGoogleSignIn()">
      Open Google sign-in
    </button>
    <button class="btn btn-outline" style="width:100%;justify-content:center;" onclick="retryAuth()">
      I've signed in — Continue
    </button>
    <p style="font-size:11px;color:var(--n-400);margin-top:14px;">Access is limited to @${esc(ALLOWED_EMAIL_DOMAIN)} accounts.</p>
  `);
}

/* ---------------- Navigation ---------------- */
function startNewBrief(){
  state.draft = blankBrief();
  state.draft.id = "new_" + Date.now();
  state.view = "editor";
  render();
}

async function openBrief(id){
  const found = state.briefs.find(b=>b.id===id);
  if(!found) return;
  state.draft = JSON.parse(JSON.stringify(found));
  state.draft._existsInDb = true;
  state.view = "editor";
  render();
  const history = await fetchHistory(id);
  if(state.draft && state.draft.id === id){
    state.draft.history = history;
    render();
  }
}

function backToDashboard(){
  state.view = "dashboard";
  state.draft = null;
  render();
}

/* ---------------- Editor topbar ---------------- */

  const b = state.draft;
  const fname = liveFileName(b);

      <button class="btn btn-outline btn-sm" onclick="openHistory('${b.id}')">Version history (${b.history.length})</button>

function renderSaveButton(){
  const b = state.draft;
  const isNew = !state.briefs.find(x=>x.id===b.id);
  if(isNew){
    return `<button class="btn btn-primary btn-sm" onclick="saveAsNew()">Publish as v1.0</button>`;
  }
  return `
    <div style="position:relative;display:inline-block;">
      <button class="btn btn-primary btn-sm" onclick="toggleSaveMenu()">Save revision ▾</button>
      <div id="saveMenu" style="display:none;position:absolute;right:0;top:38px;background:#fff;border:1px solid var(--n-200);
        border-radius:var(--radius-md);box-shadow:var(--shadow-lg);min-width:230px;z-index:30;overflow:hidden;">
        <div style="padding:10px 14px;font-size:11px;color:var(--n-400);border-bottom:1px solid var(--n-100);">Current: v${b.version}</div>
        <button class="menu-item" style="width:100%;text-align:left;padding:11px 14px;border:none;background:none;font-size:13px;" onclick="saveRevision('minor')">
          <strong>Minor</strong> → v${bumpMinor(b.version)}<br/><span style="font-size:11px;color:var(--n-500);">Typos, formatting, small corrections</span>
        </button>
        <button class="menu-item" style="width:100%;text-align:left;padding:11px 14px;border:none;background:none;font-size:13px;border-top:1px solid var(--n-100);" onclick="saveRevision('major')">
          <strong>Major</strong> → v${bumpMajor(b.version)}<br/><span style="font-size:11px;color:var(--n-500);">Spec change, scope change, re-approval needed</span>
        </button>
      </div>
    </div>`;
}
function toggleSaveMenu(){
  const m = document.getElementById("saveMenu");
  if(m) m.style.display = m.style.display === "none" ? "block" : "none";
}
document.addEventListener("click", (e)=>{
  const menu = document.getElementById("saveMenu");
  if(menu && !e.target.closest("#saveMenu") && !e.target.closest("[onclick='toggleSaveMenu()']")){
    menu.style.display = "none";
  }
});

async function saveAsNew(){
  const b = state.draft;
  if(!b.articleNo || !b.item){
    showToast("Add an Article No. and Item name before publishing.");
    return;
  }
  b.id = STORAGE_PREFIX_ID(b);
  b.version = "1.0";
  b.status = "live";
  b.createdAt = new Date().toISOString();
  b.updatedAt = b.createdAt;

  const ok = await persistBrief(b);
  if(ok){
    await insertVersionRow(b.id, "1.0", "Initial version", snapshotOf(b));
    state.briefs = await loadAllBriefs();
    b.history = await fetchHistory(b.id);
    showToast(`Saved as ${liveFileName(b)}`);
    render();
  }
}

function STORAGE_PREFIX_ID(b){
  return slugify(b.articleNo) + "__" + slugify(b.item);
}

function snapshotOf(b){
  const copy = JSON.parse(JSON.stringify(b));
  delete copy.history;
  delete copy._existsInDb;
  return copy;
}

async function saveRevision(kind){
  const b = state.draft;
  toggleSaveMenu();
  const note = prompt(kind === "major"
    ? "Briefly describe what changed (spec/scope change requiring re-approval):"
    : "Briefly describe the correction or small edit:");
  if(note === null) return; // cancelled

  const newVersion = kind === "major" ? bumpMajor(b.version) : bumpMinor(b.version);
  const now = new Date().toISOString();
  b.version = newVersion;
  b.updatedAt = now;
  b.status = "live";

  const ok = await persistBrief(b);
  if(ok){
    await insertVersionRow(b.id, newVersion, note || "(no note)", snapshotOf(b));
    state.briefs = await loadAllBriefs();
    b.history = await fetchHistory(b.id);
    showToast(`Saved as ${liveFileName(b)}`);
    render();
  }
}

async function markSigned(){
  const b = state.draft;
  if(!b.poNumber || !b.supplierIncoterm){
    showToast("Add PO Number and Supplier Incoterm first — they're used in the signed file name.");
    return;
  }
  b.status = "signed";
  b.updatedAt = new Date().toISOString();
  const ok = await persistBrief(b);
  if(ok){
    state.briefs = await loadAllBriefs();
    showToast(`Marked as signed: ${signedFileName(b)}`);
    render();
  }
}

/* ---------------- Field update helpers (no full re-render, preserves focus) ---------------- */
function updateField(path, value){
  const parts = path.split(".");
  let obj = state.draft;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = value;
  updateFilenamePreview();
}
function updateArrayField(arrName, idx, value){
  state.draft[arrName][idx] = value;
}
function updateArrayObjField(arrName, idx, key, value){
  state.draft[arrName][idx][key] = value;
}
function updatePackagingNote(idx, value){
  state.draft.packaging.notes[idx] = value;
}
function updateFilenamePreview(){
  const el = document.querySelector(".filename");
  if(el){
    const fname = liveFileName(state.draft);
    el.textContent = fname;
    el.title = fname;
  }
}

function addRow(arrName, template){
  state.draft[arrName].push(template);
  render();
}
function removeRow(arrName, idx){
  state.draft[arrName].splice(idx,1);
  if(state.draft[arrName].length===0){
    if(arrName==="inclusions") state.draft[arrName].push("");
  }
  render();
}
function addPackagingNote(){
  state.draft.packaging.notes.push("");
  render();
}
function removePackagingNote(idx){
  state.draft.packaging.notes.splice(idx,1);
  render();
}

/* ---------------- Version history modal ---------------- */
function openHistory(id){
  state.historyOpenFor = id;
  render();
}
function closeHistory(){
  state.historyOpenFor = null;
  render();
}
function renderHistoryModal(){
  const b = state.draft;
  const rows = [...b.history].reverse();
  return `
  <div class="overlay" onclick="if(event.target===this) closeHistory()">
    <div class="modal">
      <div class="modal-header"><h3>Version history — ${esc(b.articleNo)} ${esc(b.item)}</h3><button class="modal-close" onclick="closeHistory()">✕</button></div>
      <div class="modal-body">
        ${rows.length===0 ? `<p style="color:var(--n-500);font-size:13px;">No saved versions yet.</p>` :
          rows.map((h,i)=>`
            <div class="history-item ${i===0?'current':''}">
              <div class="h-top">
                <span class="h-ver">v${esc(h.version)} ${i===0?"(current)":""}</span>
                <span class="h-date">${fmtDateTime(h.date)}</span>
              </div>
              <div class="h-note">${esc(h.note||"")}</div>
              <div class="h-note" style="color:var(--n-400);">${h.createdBy ? "by " + esc(h.createdBy) : ""}</div>
              <div class="h-actions">
                <button class="btn btn-outline btn-sm" onclick='downloadSnapshot(${i})'>Download this version</button>
                ${i!==0 ? `<button class="btn btn-ghost btn-sm" onclick='restoreSnapshot(${i})'>Restore</button>` : ""}
              </div>
            </div>
          `).join("")
        }
      </div>
      <div class="modal-footer"><button class="btn btn-outline btn-sm" onclick="closeHistory()">Close</button></div>
    </div>
  </div>`;
}

function downloadSnapshot(reversedIdx){
  const b = state.draft;
  const rows = [...b.history].reverse();
  const h = rows[reversedIdx];
  const fname = versionFileName(b, h.version, fmtDate(h.date));
  triggerWordDownload(h.snapshot, fname);
}
function restoreSnapshot(reversedIdx){
  const b = state.draft;
  const rows = [...b.history].reverse();
  const h = rows[reversedIdx];
  if(!confirm(`Restore field values from v${h.version}? This won't delete history — you'll still need to save a new revision to make it current.`)) return;
  const restored = JSON.parse(JSON.stringify(h.snapshot));
  restored.history = b.history;
  restored.id = b.id;
  restored._existsInDb = true;
  restored.createdAt = b.createdAt;
  restored.createdBy = b.createdBy;
  state.draft = restored;
  state.historyOpenFor = null;
  render();
  showToast(`Restored field values from v${h.version}. Save a revision to make this current.`);
}

function handlePdFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const candidates = extractFromWorkbook(wb);
      state.importCandidates = candidates;
      state.importStep = 2;
      render();
    }catch(err){
      console.error(err);
      showToast("Couldn't read that file — make sure it's a valid .xlsx.");
    }
  };
  reader.readAsArrayBuffer(file);
}

function tryExtractFromSpecSheet(wb, sheetName){
  const result = {
    material:"", color:"", inclusions:[], techSpecs:[],
    packaging:{material:"",dimensions:"",weight:""},
  };
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:""});
  let featureCol = -1, descCol = -1, componentCol = -1, headerRowIdx = -1;
  for(let r=0;r<rows.length;r++){
    const row = rows[r].map(c=>(c||"").toString().toUpperCase());
    const fIdx = row.findIndex(c=>c.includes("FEATURE"));
    const dIdx = row.findIndex(c=>c.includes("DESCRIPTION"));
    const cIdx = row.findIndex(c=>c.includes("COMPONENT"));
    if(fIdx>-1 && dIdx>-1){ featureCol=fIdx; descCol=dIdx; componentCol=cIdx; headerRowIdx=r; break; }
  }
  if(headerRowIdx===-1) return result;

  // currentLabel drives which bucket a description row falls into. It's refreshed
  // whenever a new FEATURE value appears, or — when FEATURE is blank — a new
  // COMPONENT value (some sheets key sections like "Packaging" off the component column).
  let currentLabel = "", currentComponent = "";
  for(let r=headerRowIdx+1;r<rows.length;r++){
    const row = rows[r];
    const comp = componentCol>-1 ? (row[componentCol]||"").toString().trim() : "";
    const feat = (row[featureCol]||"").toString().trim();
    const desc = (row[descCol]||"").toString().trim();
    if(feat) currentLabel = feat;
    else if(comp) currentLabel = comp;
    if(comp && comp.toUpperCase() !== "COMPONENT") currentComponent = comp.replace(/[\r\n]+/g," ").trim();
    if(!desc) continue;
    const lbl = currentLabel.toLowerCase();
    if(lbl.includes("inclusion")) result.inclusions.push(desc);
    else if(lbl.includes("packaging dimension")) result.packaging.dimensions = desc;
    else if(lbl.includes("packaging weight")) result.packaging.weight = desc;
    else if(lbl === "packaging" || lbl.includes("packaging material")) result.packaging.material = desc;
    else if(lbl.includes("material") && !result.material) result.material = desc.split("\n")[0].slice(0,200);
    else if(lbl.includes("color") || lbl.includes("colour")){ if(!result.color) result.color = desc; }
    else if(lbl.includes("dimension")) result.techSpecs.push({label: currentComponent ? `${currentComponent} dimensions` : "Dimensions", value: desc});
    else if(lbl.includes("technical") || lbl.includes("other feature")) result.techSpecs.push({label:"Technical feature", value: desc});
  }
  return result;
}

function isUsefulExtraction(r){
  return r.inclusions.length>0 || r.techSpecs.length>0 || !!r.material || !!r.color ||
         !!r.packaging.material || !!r.packaging.dimensions;
}

function extractFromWorkbook(wb){
  const result = {
    articleNo:"", item:"", description:"", material:"", color:"",
    inclusions:[], techSpecs:[],
    packaging:{material:"",dimensions:"",weight:""},
    sourceSheet:""
  };

  // 1) Overview-style sheet: simple label/value pairs in column A/B
  const overviewSheetName = wb.SheetNames.find(n=>/overview/i.test(n));
  if(overviewSheetName){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[overviewSheetName], {header:1, defval:""});
    for(const row of rows){
      const label = (row[0]||"").toString().toLowerCase();
      const val = (row[1]||"").toString().trim();
      if(!val) continue;
      if(label.includes("product ident")) result.articleNo = val;
      else if(label.includes("product name")) result.item = val;
      else if(label.includes("product description")) result.description = val;
    }
  }

  // 2) Spec sheet(s) with COMPONENT / FEATURE / DESCRIPTION layout. Some PD sheets keep
  // the "Final" tab blank until a supplier is chosen, so try candidates in order and
  // fall back to the next one if a tab turns out to have no usable rows.
  const specCandidates = wb.SheetNames.filter(n=>/spec/i.test(n));
  specCandidates.sort((a,b)=>{
    const score = n => /final/i.test(n) ? 0 : /initial/i.test(n) ? 1 : 2;
    return score(a) - score(b);
  });
  for(const name of specCandidates){
    const extracted = tryExtractFromSpecSheet(wb, name);
    if(isUsefulExtraction(extracted)){
      Object.assign(result, extracted);
      result.sourceSheet = name;
      break;
    }
  }

  return result;
}

function applyImport(){
  const c = state.importCandidates;
  const b = blankBrief();
  b.id = "new_" + Date.now();
  b.articleNo = document.getElementById("imp_articleNo").value.trim();
  b.item = document.getElementById("imp_item").value.trim();
  b.description = document.getElementById("imp_description").value.trim();
  b.material = document.getElementById("imp_material").value.trim();
  b.color = document.getElementById("imp_color").value.trim();
  b.packaging.material = document.getElementById("imp_pkgMaterial").value.trim();
  b.packaging.dimensions = document.getElementById("imp_pkgDims").value.trim();
  b.packaging.weight = document.getElementById("imp_pkgWeight").value.trim();
  b.inclusions = c.inclusions.length ? c.inclusions : [""];
  b.techSpecs = c.techSpecs.length ? c.techSpecs : [{label:"",value:""}];

  state.draft = b;
  state.importStep = 0;
  state.importCandidates = null;
  state.view = "editor";
  render();
  showToast("Imported — review every field before publishing.");
}

      <tr><td class="lbl">Article No.</td><td>${esc(b.articleNo)}</td></tr>

function printBrief(){
  const b = state.draft;
  const win = window.open("", "_blank");
  win.document.write(`<html><head><title>${esc(liveFileName(b))}</title><style>${DOC_STYLE}</style></head><body>${buildBriefDocumentHTML(b)}</body></html>`);
  win.document.close();
  setTimeout(()=>win.print(), 400);
}

function downloadWord(){
  triggerWordDownload(state.draft, liveFileName(state.draft));
}

function triggerWordDownload(brief, filename){
  const html = `
  <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${esc(filename)}</title>
  <!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->
  <style>${DOC_STYLE}</style>
  </head><body>${buildBriefDocumentHTML(brief)}</body></html>`;
  const blob = new Blob(['\ufeff', html], {type: "application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Downloaded ${filename}.doc`);
}
